name: Gerar APK Oficial

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Criar Chaves e Construir APK
      run: |
        # Configura as chaves de assinatura automáticas para não travar com perguntas
        bubblewrap init --manifest=https://douglascancaonova.github.io/monitorytclone/manifest.json --meta=twa-manifest.json --skipConfig
        
        # Gera uma chave de teste silenciosa
        keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass "123456" -keypass "123456" -dname "CN=Douglas, OU=Monitor, O=Monitor, L=Br, S=Br, C=BR"
        
        # Cria o arquivo de configuração que o Bubblewrap precisa para não fazer perguntas
        echo '{"appVersionName": "1.0.0", "appVersionCode": 1, "signingKey": {"path": "./android.keystore", "alias": "android"}, "generatorApp": "bubblewrap"}' > twa-user-settings.json
        
        # Compila ignorando os prompts interativos
        bubblewrap build --signingKeyPath=./android.keystore --signingKeyAlias=android --signingKeyPassword="123456" --signingKeyKeyPassword="123456" || true

    - name: Liberar Download do APK
      uses: actions/upload-artifact@v4
      with:
        name: Monitor-YT-APK
        path: ./*.apk
