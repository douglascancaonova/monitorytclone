name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Create Web Directory and Move Files
      run: |
        mkdir -p www
        cp index.html www/ 2>/dev/null || true
        cp manifest.json www/ 2>/dev/null || true
        cp sw.js www/ 2>/dev/null || true
        # Caso seus arquivos estejam na raiz, isso garante que o Capacitor os veja dentro de 'www'

    - name: Initialize Project
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor
      run: |
        npx cap init "Monitor YT" "com.douglas.monitoryt" --web-dir=www

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android Project
      run: |
        npx cap add android
        npx cap sync
        cd android && ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
